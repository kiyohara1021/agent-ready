[project]
name = "python-uv"
version = "0.1.0"
description = "Fixture repository modelling a well-prepared Python project."
requires-python = ">=3.12"

[dependency-groups]
dev = ["mypy>=1.13", "pytest>=8.3", "ruff>=0.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true
